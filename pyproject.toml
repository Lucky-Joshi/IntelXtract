[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = [".venv", "build", "dist", "exports", "logs", "cache"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "ASYNC",# flake8-async
    "S",    # flake8-bandit (security)
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are expected in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "cli", "core", "database", "gui", "modules", "plugins", "reports"]

[tool.mypy]
python_version = "3.13"
exclude = ["\\.venv/", "build/", "dist/", "exports/", "logs/", "cache/"]
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "integration: tests that require network access (run with -m integration)",
]
