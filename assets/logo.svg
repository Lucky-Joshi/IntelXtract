<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96" role="img" aria-label="IntelXtract — OSINT Automation Platform">
  <defs>
    <linearGradient id="ixShield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <!-- Icon: shield + magnifier -->
  <g transform="translate(12,12)">
    <path d="M36 6 L64 16 V40 C64 56 50 66 36 70 C22 66 8 56 8 40 V16 Z"
