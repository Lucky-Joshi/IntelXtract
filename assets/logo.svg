    <circle cx="33" cy="32" r="13" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <line x1="42.5" y1="41.5" x2="53" y2="52" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="50" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#E2E8F0">Intel</tspan><tspan fill="#22D3EE">Xtract</tspan>
  </text>
  <text x="101" y="72" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="13" font-weight="500" fill="#94A3B8" letter-spacing="2.5">OSINT AUTOMATION PLATFORM</text>
</svg>
